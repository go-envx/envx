# Mise https://mise.jdx.dev/

# ---------------------------------------------------------
# Settings
# https://mise.jdx.dev/configuration/settings.html
# ---------------------------------------------------------
[settings]
lockfile = true
minimum_release_age = "24h"

# ---------------------------------------------------------
# Tools
# https://mise-versions.jdx.dev/
# ---------------------------------------------------------
[tools]

# Go
go = "1.27.2"                     # https://go.dev/ref/spec
golangci-lint = "2.15.0"          # https://golangci-lint.run/
goreleaser = "2.18.3"             # https://goreleaser.com/

# Node
node = "24.22.0"                  # https://nodejs.org/docs/latest/api/
pnpm = "12.14.0"                   # https://pnpm.io/motivation

# Tools
gh = "2.102.0"                     # https://cli.github.com/manual/
svu = "3.4.1"                     # https://github.com/caarlos0/svu
task = "3.54.0"                   # https://taskfile.dev/docs/guide
