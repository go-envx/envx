version: '3'

includes:
  envx:
    taskfile: ./app/Taskfile.yaml
    dir: ./app
  docs:
    taskfile: ./docs/Taskfile.yaml
    dir: ./docs

tasks:
  install:
    desc: Install all dependencies (Node + Python)
    cmds:
      - mise install
      - pnpm install
      - task envx:install

  clean:git:
    desc: Remove local branches whose remote was deleted (interactive)
    cmds:
      - pnpm exec smili clean-git
