name: Release (on publish) 🏷️

# Fires when you PUBLISH a drafted release (see release-draft.yaml). Publishing is what
# creates the immutable `vX.Y.Z` tag; this workflow then does everything that
# must only happen for a real, public release:
#   • build & push the multi-arch GHCR container image
#   • publish the Go module tag (`app/vX.Y.Z`) so `go install ...@vX.Y.Z` resolves
#   • deploy the docs site
#
# It ignores pre-releases and any tag that isn't a `vX.Y.Z` release.

on:
  release:
    types: [published]

# Don't finalize the same release twice at once.
concurrency:
  group: release-published-${{ github.event.release.tag_name }}
  cancel-in-progress: false

# Least-privilege default; each job elevates only what it needs.
permissions:
  contents: read

jobs:
  # ─────────────────────────────────────────────────────────────
  # Finalize: push the container image and the Go module tag
  # ─────────────────────────────────────────────────────────────
  finalize:
    name: Image & module tag
    # Only real version releases: a `vX.Y.Z` tag, and not a pre-release.
    if: ${{ startsWith(github.event.release.tag_name, 'v') && !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the app/vX.Y.Z module tag
      packages: write # push the container image to GHCR
    defaults:
      run:
        working-directory: app
    env:
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - name: Checkout the released tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0 # full history + tags so GoReleaser derives the version
      - name: Setup tools
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: go goreleaser
      # GoReleaser builds the multi-arch envx image with buildx. QEMU enables the
      # arm64 build on the amd64 runner; the login lets it push to GHCR.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Build + push ONLY the container image. RELEASE_DISABLE=true turns off
      # GoReleaser's GitHub-release pipe (see .goreleaser.yaml), so it never tries
      # to modify the release you just published — which is now immutable — it
      # just rebuilds the binaries and pushes the multi-arch image.
      - name: Build & push container image
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_DISABLE: "true"
        run: goreleaser release --clean
      # Publish the Go module version tag (`app/vX.Y.Z`) so
      # `go install github.com/go-envx/envx/app/cmd/envx@vX.Y.Z` (and `@latest`)
      # resolves. The module lives in the `app/` subdirectory, so Go needs a tag
      # prefixed with the module path. It points at the same commit as the release.
      - name: Publish Go module tag
        env:
          MODULE_TAG: "app/${{ github.event.release.tag_name }}"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git rev-parse -q --verify "refs/tags/${MODULE_TAG}" >/dev/null; then
            echo "Tag ${MODULE_TAG} already exists; skipping."
          else
            git tag "${MODULE_TAG}"
            git push origin "${MODULE_TAG}"
          fi

  # ─────────────────────────────────────────────────────────────
  # Docs: deploy the documentation site for the published release
  # ─────────────────────────────────────────────────────────────
  deploy-docs:
    name: Docs
    needs: finalize
    if: ${{ startsWith(github.event.release.tag_name, 'v') && !github.event.release.prerelease }}
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/release-docs.yaml
