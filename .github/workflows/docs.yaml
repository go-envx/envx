name: Deploy Docs 📚

# Builds and publishes the documentation site to GitHub Pages. It runs either:
#   • as part of a release — called by release.yaml via `workflow_call`, so the
#     site is deployed in lockstep with a version, or
#   • on demand — `workflow_dispatch` from the Actions tab, for a docs-only fix
#     between releases (built from the branch/tag you select).
on:
  workflow_call:
  workflow_dispatch:

# Scopes for the OIDC-based Pages deployment. Applied on the workflow_dispatch
# path; on the workflow_call path these are granted by the calling job.
permissions:
  contents: read
  pages: write
  id-token: write

# Serialize Pages deployments and let any in-progress deploy finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # ─────────────────────────────────────────────────────────────
  # Deploy: build the Astro site and publish it to GitHub Pages
  # ─────────────────────────────────────────────────────────────
  deploy:
    name: Deploy Docs
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    defaults:
      run:
        working-directory: docs
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup tools
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: node pnpm task
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build site
        run: task build
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
