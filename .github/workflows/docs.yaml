name: Deploy Docs 📚

# Builds and publishes the documentation site to GitHub Pages. It runs either:
#   • as part of a release — called by release.yaml via `workflow_call`, so the
#     site is deployed in lockstep with a version, or
#   • on demand — `workflow_dispatch` from the Actions tab, for a docs-only fix
#     between releases (built from the branch/tag you select).
on:
  workflow_call:
  workflow_dispatch:

# Scopes for the OIDC-based Pages deployment. Applied on the workflow_dispatch
# path; on the workflow_call path these are granted by the calling job.
permissions:
  contents: read
  pages: write
  id-token: write

# Serialize Pages deployments and let any in-progress deploy finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # ─────────────────────────────────────────────────────────────
  # Deploy: build the Astro site and publish it to GitHub Pages
  # ─────────────────────────────────────────────────────────────
  deploy:
    name: Deploy Docs
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    defaults:
      run:
        working-directory: docs
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Setup tools
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          install_args: node pnpm task
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build site
        run: task build
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
