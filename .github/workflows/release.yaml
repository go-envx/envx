name: Release 🚀

# Releases are cut MANUALLY from the Actions tab in stages,
# mirroring a semantic-release dry-run/handshake flow but Go-native:
#
#   1. preview     — always runs. `svu` derives the next semver from Conventional
#                    Commits since the last release and surfaces it in the job
#                    summary. No approval, read-only.
#   2. handshake   — only when `expected_version` is set. Fails early (before any
#                    approval) if svu's computed version doesn't match what you say
#                    you expect, so a mismatch never wastes an approval.
#   3. release     — only when `expected_version` is set and the handshake passed.
#                    Gated by the `production` environment (the approval prompt).
#                    Tags the commit, runs GoReleaser (binaries + GitHub release +
#                    changelog), and publishes the `app/vX.Y.Z` module tag.
#   4. deploy-docs — deploys the docs site (reusable docs.yaml) after a release.
#
# Leave `expected_version` blank to only preview (no tag, release, or deploy).
on:
  workflow_dispatch:
    inputs:
      expected_version:
        description: "Version you expect to release, e.g. 1.0.1. Leave blank to only preview."
        type: string
        required: false
        default: ""

# Never cut two releases at once.
concurrency:
  group: release
  cancel-in-progress: false

# Least-privilege default; each job elevates only what it needs.
permissions:
  contents: read

jobs:
  # ─────────────────────────────────────────────────────────────
  # Preview: compute the next version with svu (always runs)
  # ─────────────────────────────────────────────────────────────
  preview:
    name: Preview
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.svu.outputs.version }}
      release: ${{ steps.svu.outputs.release }}
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0 # full history + tags so svu can analyze commits
      - name: Setup tools
        uses: jdx/mise-action@dad1bfd3df957f44999b559dd69dc1671cb4e9ea # v4.2.1
        with:
          install_args: svu
      # svu derives the next semver from Conventional Commits since the last
      # `vX.Y.Z` tag (it ignores the non-semver `app/*` tags). If nothing since
      # the last tag warrants a bump, `svu next` == `svu current` -> no release.
      - name: Compute next version
        id: svu
        run: |
          current="$(svu current 2>/dev/null || echo v0.0.0)"; current="${current#v}"
          next="$(svu next)"; next="${next#v}"
          echo "current: $current | next: $next"
          {
            echo "## Release preview"
            echo ""
            echo "- **Current:** \`$current\`"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$next" = "$current" ]; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "version=" >> "$GITHUB_OUTPUT"
            echo "- **Next:** _no release_ — no qualifying commits since the last release." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "version=$next" >> "$GITHUB_OUTPUT"
            echo "- **Next:** \`$next\`" >> "$GITHUB_STEP_SUMMARY"
          fi

  # ─────────────────────────────────────────────────────────────
  # Handshake: verify the expected version matches svu (pre-approval gate)
  # ─────────────────────────────────────────────────────────────
  handshake:
    name: Verify Version
    needs: preview
    if: ${{ inputs.expected_version != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Compare expected vs computed version
        env:
          EXPECTED: ${{ inputs.expected_version }}
          RESOLVED: ${{ needs.preview.outputs.version }}
          RELEASE: ${{ needs.preview.outputs.release }}
        run: |
          if [ "$RELEASE" != "true" ] || [ -z "$RESOLVED" ]; then
            echo "::error::You expected $EXPECTED, but svu resolved no release (no qualifying commits). Aborting before approval."
            exit 1
          fi
          if [ "$RESOLVED" != "$EXPECTED" ]; then
            echo "::error::You expected $EXPECTED, but svu resolved $RESOLVED. Aborting before approval."
            exit 1
          fi
          echo "Version handshake OK: $EXPECTED"

  # ─────────────────────────────────────────────────────────────
  # Release: tag, build binaries via GoReleaser, publish the module tag
  # ─────────────────────────────────────────────────────────────
  release:
    name: Release
    needs: [preview, handshake]
    if: ${{ inputs.expected_version != '' }}
    runs-on: ubuntu-latest
    environment: production # approval prompt (configure required reviewers)
    permissions:
      contents: write # create/push tags + the GitHub release
      packages: write # push the container image to GHCR
    defaults:
      run:
        working-directory: app
    env:
      VERSION: ${{ inputs.expected_version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0 # GoReleaser needs full history for the changelog
      - name: Setup tools
        uses: jdx/mise-action@dad1bfd3df957f44999b559dd69dc1671cb4e9ea # v4.2.1
        with:
          install_args: go goreleaser
      # GoReleaser builds the multi-arch envx image with buildx. QEMU enables the
      # arm64 build on the amd64 runner; the login lets it push to GHCR.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@06fb636fac595d6fb4b28a5dfcb21a6f5091859c # v4.5.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      # Create + push the release tag GoReleaser builds from. Guarded so a re-run
      # after a partial failure doesn't error on an already-created tag.
      - name: Create and push release tag
        run: |
          if git rev-parse -q --verify "refs/tags/v${VERSION}" >/dev/null; then
            echo "Tag v${VERSION} already exists; skipping create."
          else
            git tag -a "v${VERSION}" -m "v${VERSION}"
            git push origin "v${VERSION}"
          fi
      - name: Run GoReleaser
        run: goreleaser release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Publish the Go module version tag (`app/vX.Y.Z`) so
      # `go install github.com/go-envx/envx/app/cmd/envx@vX.Y.Z` (and `@latest`)
      # resolves. Because the module lives in the `app/` subdirectory, Go needs a
      # tag prefixed with the module path.
      - name: Publish Go module tag
        env:
          MODULE_TAG: "app/v${{ inputs.expected_version }}"
        run: |
          if git rev-parse -q --verify "refs/tags/${MODULE_TAG}" >/dev/null; then
            echo "Tag ${MODULE_TAG} already exists; skipping."
          else
            git tag "${MODULE_TAG}"
            git push origin "${MODULE_TAG}"
          fi

  # ─────────────────────────────────────────────────────────────
  # Docs: deploy the documentation site after a successful release
  # ─────────────────────────────────────────────────────────────
  deploy-docs:
    name: Docs
    needs: release
    if: ${{ inputs.expected_version != '' }}
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/docs.yaml
