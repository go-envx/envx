version: '3'

tasks:
  all:
    desc: 'Run the full pipeline in series: check, test, build, install'
    cmds:
      - task: check
      - task: test
      - task: build
      - task: install

  run:
    desc: 'Run the CLI on the fly (usage: task run -- <args>)'
    cmds:
      - go run ./cmd/envx {{.CLI_ARGS}}

  build:
    desc: Build the CLI binary
    cmds:
      - go build -o bin/envx ./cmd/envx

  install:
    desc: Install the CLI to ~/.local/bin (on PATH, stable across Go versions)
    cmds:
      - go build -o "$HOME/.local/bin/envx" ./cmd/envx

  test:
    desc: Run the entire test suite for the CLI (unit and e2e)
    cmds:
      - task: test:unit
      - task: test:e2e

  test:unit:
    desc: Run unit tests for the CLI
    cmds:
      - go test -race -coverpkg=./... -coverprofile=coverage.out ./...

  test:e2e:
    desc: Run end-to-end integration tests for the CLI
    cmds:
      - go test -race -tags=e2e ./test/...

  check:
    desc: Run formatting, static analysis, and vulnerability scanning
    cmds:
      - golangci-lint fmt
      - golangci-lint run
      - go tool govulncheck ./...

  clean:
    desc: Clean build artifacts
    cmds:
      - rm -rf bin/
