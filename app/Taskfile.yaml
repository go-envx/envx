version: '3'

vars:
  # The race detector needs cgo, which Go disables when no C compiler is found.
  RACE:
    sh: go env CGO_ENABLED
  RACE_FLAG: '{{if eq .RACE "1"}}-race{{end}}'
  INSTALL_DIR: '{{if eq OS "windows"}}{{.LOCALAPPDATA}}/Programs/envx{{else}}{{.HOME}}/.local/bin{{end}}'

tasks:
  all:
    desc: 'Run the full pipeline in series: check, test, build, install'
    cmds:
      - task: check
      - task: test
      - task: build
      - task: install

  run:
    desc: 'Run the CLI on the fly (usage: task run -- <args>)'
    cmds:
      - go run ./cmd/envx {{.CLI_ARGS}}

  build:
    desc: Build the CLI binary
    cmds:
      - go build -o bin/envx{{exeExt}} ./cmd/envx

  install:
    desc: 'Install the CLI to ~/.local/bin (Windows: %LOCALAPPDATA%\Programs\envx); add it to PATH'
    cmds:
      - go build -o "{{.INSTALL_DIR}}/envx{{exeExt}}" ./cmd/envx

  test:
    desc: Run the entire test suite for the CLI (unit and e2e)
    cmds:
      - task: test:unit
      - task: test:e2e

  test:unit:
    desc: Run unit tests for the CLI
    cmds:
      - go test {{.RACE_FLAG}} -coverpkg=./... -coverprofile=coverage.out ./...

  test:e2e:
    desc: Run end-to-end integration tests for the CLI
    cmds:
      - go test {{.RACE_FLAG}} -tags=e2e ./test/...

  check:
    desc: Run formatting, static analysis, and vulnerability scanning
    cmds:
      - golangci-lint fmt
      - golangci-lint run
      - go tool govulncheck ./...

  clean:
    desc: Clean build artifacts
    cmds:
      - rm -rf bin/
