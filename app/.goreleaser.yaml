# GoReleaser configuration for envx CLI
# https://goreleaser.com/customization/
version: 2

project_name: envx

builds:
  - main: ./cmd/envx
    binary: envx
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats: zip
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

# Minimal `scratch` image published to GHCR containing only the binary. It is a
# binary donor: consumers `COPY --from=ghcr.io/go-envx/envx:<tag> /envx ...` into
# their own images (see ./Dockerfile). Uses buildx to build a multi-arch manifest
# from the already-built linux binaries — no rebuild.
dockers_v2:
  - images:
      - ghcr.io/go-envx/envx
    # `{{ .Version }}` (e.g. 1.0.1) is the reproducible pin consumers should use;
    # the rolling `latest`/`1`/`1.0` tags are conveniences.
    tags:
      - "{{ .Version }}"
      - "{{ .Major }}.{{ .Minor }}"
      - "{{ .Major }}"
      - "latest"
    platforms:
      - linux/amd64
      - linux/arm64
    # OCI labels for provenance. `image.source` links the GHCR package to the
    # repository (and inherits its visibility/permissions).
    labels:
      org.opencontainers.image.title: "{{ .ProjectName }}"
      org.opencontainers.image.description: "Composable environment management for multi-project workspaces."
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.source: "https://github.com/go-envx/envx"
      org.opencontainers.image.licenses: "MIT"

changelog:
  sort: asc
  groups:
    - title: "✨ Features"
      regexp: '^feat(\(.+\))?:'
      order: 0
    - title: "🐛 Bug Fixes"
      regexp: '^fix(\(.+\))?:'
      order: 1
    - title: "📚 Documentation"
      regexp: '^docs(\(.+\))?:'
      order: 2
    - title: "🔧 Maintenance"
      order: 999

release:
  draft: false
  prerelease: auto
  name_template: "v{{ .Version }}"
