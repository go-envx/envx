# golangci-lint v2 configuration
# https://golangci-lint.run/usage/configuration/
version: "2"

linters:
  enable:
    # Correctness: catches bugs
    - errcheck      # Unchecked error returns
    - staticcheck   # Type-aware analysis (Go's most powerful linter)
    - govet         # Subtle correctness issues
    - unused        # Dead code detection
    - gosec         # Security vulnerability patterns
    - noctx         # HTTP requests missing context
    - errorlint     # Incorrect error wrapping (errors.Is/As)

    # Code quality: maintainability
    - lll           # Maximum line length
    - misspell      # Typos in comments and strings
    - errname       # Error type naming conventions
    - exhaustive    # Switch statements handle all enum cases
    - gocritic      # Opinionated but catches real issues

  settings:
    exhaustive:
      default-signifies-exhaustive: true
    gocritic:
      enabled-tags:
        - diagnostic
        - style
        - performance
      settings:
        hugeParam:
          sizeThreshold: 256
    lll:
      line-length: 88
    gosec:
      excludes:
        - G104 # Covered by errcheck

formatters:
  enable:
    - gofumpt
